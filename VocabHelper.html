<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VocabHelper</title>
    <style>
        /* 浅色主题变量（默认） */
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --ignore: #94a3b8;
            --bg: #f8fafc;
            --text: #334155;
            --card-bg: #ffffff;
            --border-light: #cbd5e1;
            --border-lighter: #f1f5f9;
            --header-text: #64748b;
            --stat-box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            --flashcard-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
            --btn-main-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2);
            --btn-review-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.2);
            --btn-reveal-bg: #1e293b;
            --btn-reveal-text: white;
            --progress-bg: #f1f5f9;
            --tag-master-bg: #dcfce7;
            --tag-master-text: #166534;
            --tag-learn-bg: #fee2e2;
            --tag-learn-text: #991b1b;
            --tag-new-bg: #e0f2fe;
            --tag-new-text: #075985;
            --tag-count-bg: #f1f5f9;
            --tag-count-text: #475569;
            --tag-ignored-bg: #cbd5e1;
            --tag-ignored-text: #334155;
            --btn-sm-red-bg: #cbd5e1;
            --btn-sm-red-text: #333;
            --btn-sm-red-hover-bg: #ef4444;
            --btn-sm-red-hover-text: white;
            --manage-btn-bg: #e2e8f0;
            --manage-btn-text: #334155;
            --manage-btn-hover: #cbd5e1;
        }

        /* 暗色主题变量 - 提升对比度 */
        .dark-theme {
            --bg: #1e293b;
            --text: #e2e8f0;
            --card-bg: #334155;
            --border-light: #475569;
            --border-lighter: #1e293b;
            --header-text: #94a3b8;
            --stat-box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            --flashcard-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            --btn-main-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            --btn-review-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.4);
            --btn-reveal-bg: #2d3a4f;
            --btn-reveal-text: #ffffff;
            --progress-bg: #1e293b;
            
            --primary: #a78bfa;
            --success: #4ade80;
            --warning: #fcd34d;
            --danger: #fca5a5;
            --ignore: #9ca3af;
            
            --tag-master-bg: #14532d;
            --tag-master-text: #bbf7d0;
            --tag-learn-bg: #7f1d1d;
            --tag-learn-text: #fecaca;
            --tag-new-bg: #075985;
            --tag-new-text: #bae6fd;
            --tag-count-bg: #475569;
            --tag-count-text: #f1f5f9;
            --tag-ignored-bg: #64748b;
            --tag-ignored-text: #f1f5f9;
            
            --btn-sm-red-bg: #64748b;
            --btn-sm-red-text: #f1f5f9;
            --btn-sm-red-hover-bg: #ef4444;
            --btn-sm-red-hover-text: white;
            
            --manage-btn-bg: #4b5565;
            --manage-btn-text: #f1f5f9;
            --manage-btn-hover: #6b7280;
        }

        html, body { 
            height: 100%; 
            margin: 0; 
            overflow: hidden;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            max-width: 600px; 
            margin: 0 auto; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }
        
        button { cursor: pointer; border: none; transition: 0.15s; font-weight: 600; font-family: inherit; }
        button:active { transform: scale(0.97); opacity: 0.9; }
        input, textarea { 
            border: 1px solid var(--border-light); 
            border-radius: 10px; 
            padding: 12px; 
            width: 100%; 
            box-sizing: border-box; 
            font-family: monospace; 
            outline: none; 
            transition: border 0.2s; 
            background: var(--card-bg);
            color: var(--text);
        }
        input:focus, textarea:focus { border-color: var(--primary); }

        .app-header { 
            text-align: center; 
            margin-bottom: 25px; 
            margin-top: 10px; 
            position: relative; 
        }
        .app-title { 
            font-size: 2rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #6366f1, #a855f7); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: -1px; 
            margin: 0; 
        }
        .app-desc { font-size: 0.9rem; color: var(--header-text); margin-top: 5px; }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 30px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            color: var(--text);
            transition: 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        #home-view { 
            display: block; 
            overflow-y: auto; 
            flex: 1; 
            min-height: 0; 
            padding-right: 4px;
        }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 30px; }
        .stat-box { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 16px; 
            box-shadow: var(--stat-box-shadow); 
            text-align: center; 
        }
        .stat-num { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 4px; }
        .stat-txt { font-size: 0.75rem; color: var(--header-text); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-main { 
            width: 100%; 
            padding: 22px; 
            margin-bottom: 16px; 
            border-radius: 16px; 
            font-size: 1.1rem; 
            color: white; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: var(--btn-main-shadow); 
        }
        .btn-new { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .btn-review { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: var(--btn-review-shadow); }
        .btn-manage { background: #475569; padding: 16px; justify-content: center; box-shadow: none; font-size: 1rem; }

        #study-view { 
            display: none; 
            flex: 1;                     
            flex-direction: column; 
            min-height: 0;
            overflow: hidden;
        }
        .flashcard { 
            background: var(--card-bg); 
            flex: 1;                      
            border-radius: 24px; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            box-shadow: var(--flashcard-shadow); 
            margin-bottom: 15px; 
            position: relative; 
            border: 1px solid var(--border-lighter);
            overflow-y: auto;
            min-height: 0;                 
        }
        
        .progress-track { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 8px; 
            background: var(--progress-bg); 
            border-radius: 24px 24px 0 0; 
            overflow: hidden; 
        }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .word-main { 
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 800; 
            color: var(--text);
            margin-bottom: 15px; 
            letter-spacing: normal;
            line-height: 1.3;
            overflow-x: auto;
            white-space: normal;
            max-width: 100%;
            -webkit-overflow-scrolling: touch;
        }
        
        .def-main { 
            display: block;
            width: 100%;
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            color: var(--primary);
            font-weight: 600;
            border-top: none;              
            padding-top: 0;
            margin-top: 0;
            line-height: 1.4;
            letter-spacing: normal;
            word-break: normal;
            overflow-x: auto;
            white-space: normal;
            max-width: 100%;
            -webkit-overflow-scrolling: touch;
            
            max-height: 0;
            opacity: 0;
            transform: scale(0.9);
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s ease, transform 0.2s ease, padding 0.2s ease, margin 0.2s ease, border 0.2s ease;
        }
        .def-main.show {
            max-height: 500px;              
            opacity: 1;
            transform: scale(1);
            border-top: 2px dashed var(--border-light);
            padding-top: 25px;
            margin-top: 20px;
            overflow-x: auto;
        }
        
        .btn-reveal { 
            width: 100%; 
            padding: 20px; 
            background: var(--btn-reveal-bg); 
            color: var(--btn-reveal-text); 
            border-radius: 16px; 
            font-size: 1.1rem; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            margin-bottom: 0; 
            flex-shrink: 0;                
        }
        
        .action-grid { 
            display: none; 
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 0;
            flex-shrink: 0;                
        }
        .act-btn { 
            flex: 1 1 calc(33.33% - 8px); 
            min-width: 100px; 
            padding: 14px 4px; 
            border-radius: 12px; 
            color: white; 
            font-size: 0.9rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 4px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        }
        .act-btn small { font-size: 0.7rem; opacity: 0.9; font-weight: normal; }
        .btn-ignore-study { background: var(--ignore); }
        .btn-ignore-study:hover { background: #64748b; }

        #manage-view { 
            display: none; 
            overflow-y: auto; 
            flex: 1; 
            min-height: 0; 
            padding-right: 4px;
        }
        .panel { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); 
            border: 1px solid var(--border-lighter);
        }
        .panel h3 { 
            margin-top: 0; 
            font-size: 1rem; 
            color: var(--text); 
            border-bottom: 1px solid var(--border-lighter); 
            padding-bottom: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .list-row { 
            padding: 14px 0; 
            border-bottom: 1px solid var(--border-lighter); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .list-row:last-child { border-bottom: none; }
        .list-row.ignored { opacity: 0.5; background: var(--border-lighter); }
        
        .tag { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; font-weight: bold; }
        .t-master { background: var(--tag-master-bg); color: var(--tag-master-text); }
        .t-learn { background: var(--tag-learn-bg); color: var(--tag-learn-text); }
        .t-new { background: var(--tag-new-bg); color: var(--tag-new-text); }
        .t-count { background: var(--tag-count-bg); color: var(--tag-count-text); }
        .t-ignored { background: var(--tag-ignored-bg); color: var(--tag-ignored-text); }

        .btn-sm { 
            padding: 6px 10px; 
            border-radius: 8px; 
            font-size: 0.75rem; 
            margin-left: 5px; 
            color: white; 
            white-space: nowrap; 
        }
        .btn-grn { background: var(--success); }
        .btn-yel { background: var(--warning); }
        .btn-red { 
            background: var(--btn-sm-red-bg); 
            color: var(--btn-sm-red-text); 
        }
        .btn-red:hover { 
            background: var(--btn-sm-red-hover-bg); 
            color: var(--btn-sm-red-hover-text); 
        }
        .btn-ignore { background: var(--ignore); color: white; }
        .btn-ignore:hover { background: #64748b; }
        .btn-recover { background: var(--primary); color: white; }

        .file-actions { display: flex; gap: 8px; margin-top: 8px; }
        .file-actions button { 
            flex: 1; 
            background: var(--manage-btn-bg); 
            color: var(--manage-btn-text); 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: 600; 
            border: 1px solid var(--border-light); 
        }
        .file-actions button:hover { background: var(--primary); border-color: var(--primary); color: white; }
        .hidden-input { display: none; }

        .toggle-ignored { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .toggle-ignored label { font-size: 0.9rem; color: var(--header-text); }

        .back-home-btn {
            background: var(--manage-btn-bg);
            color: var(--manage-btn-text);
            border: 1px solid var(--border-light);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .back-home-btn:hover {
            background: var(--manage-btn-hover);
        }

        .backup-btn {
            background: var(--manage-btn-bg);
            color: var(--manage-btn-text);
            border: 1px solid var(--border-light);
        }
        .backup-btn:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

<div id="home-view">
    <div class="app-header">
        <h1 class="app-title">VocabHelper</h1>
        <div class="app-desc">极简 · 高效 · 单词记忆助手</div>
        <div class="theme-toggle" onclick="toggleTheme()" id="theme-toggle">🌙</div>
    </div>

    <div style="margin-bottom: 20px; text-align: right; display:flex; justify-content: flex-end; align-items: center; gap:10px;">
        <span style="font-size: 0.85rem; color: var(--header-text); font-weight:bold;">每次学习数量</span>
        <input type="number" id="batch-set" value="10" style="width: 60px; text-align: center; padding: 8px;" onchange="saveConfig()">
    </div>

    <div class="dashboard">
        <div class="stat-box">
            <span class="stat-num" id="s-new" style="color:var(--primary)">0</span>
            <span class="stat-txt">待学新词</span>
        </div>
        <div class="stat-box">
            <span class="stat-num" id="s-learn" style="color:var(--warning)">0</span>
            <span class="stat-txt">学习中</span>
        </div>
        <div class="stat-box">
            <span class="stat-num" id="s-master" style="color:var(--success)">0</span>
            <span class="stat-txt">完全掌握</span>
        </div>
    </div>

    <button class="btn-main btn-new" onclick="startSession('new')">
        <span>🚀 学习新词</span>
        <small style="opacity:0.8">Start New</small>
    </button>
    <button class="btn-main btn-review" onclick="startSession('review')">
        <span>↺ 开始复习</span>
        <small style="opacity:0.8">Review</small>
    </button>
    <button class="btn-main btn-manage" onclick="nav('manage')">🛠 词库 / 数据备份</button>
</div>

<div id="study-view">
    <div style="display:flex; justify-content:space-between; color:var(--header-text); margin-bottom:15px; font-weight:bold; font-size:0.9rem;">
        <span onclick="confirmExit()" style="cursor:pointer">✕ 结束</span>
        <span>剩余: <b id="q-count" style="color:var(--text)">0</b></span>
    </div>

    <div class="flashcard">
        <div class="progress-track"><div class="progress-fill" id="bar"></div></div>
        <div style="position:absolute; top:20px; right:20px; color:var(--header-text); font-size:0.8rem; font-weight:bold;">SCORE: <span id="score-val" style="color:var(--primary)">0</span>%</div>
        
        <div class="word-main" id="w-text">Loading...</div>
        <div class="def-main" id="d-text"></div>
    </div>

    <button id="reveal-btn" class="btn-reveal" onclick="showDef()">👀 查看释义</button>

    <div id="ctrl-btns" class="action-grid">
        <button class="act-btn" style="background:#ef4444" onclick="rate(-30)">❌ 忘了<small>-30</small></button>
        <button class="act-btn" style="background:#f59e0b" onclick="rate(15)">🤔 模糊<small>+15</small></button>
        <button class="act-btn" style="background:#6366f1" onclick="rate(35)">🧠 认识<small>+35</small></button>
        <button class="act-btn" style="background:#10b981" onclick="setMaster()">✅ 秒杀<small>直达100</small></button>
        <button class="act-btn btn-ignore-study" onclick="ignoreCurrent()">✂️ 斩掉<small>永久忽略</small></button>
    </div>
</div>

<div id="manage-view">
    <button onclick="nav('home')" class="back-home-btn">← 返回首页</button>
    
    <div class="panel">
        <h3>💾 数据备份与恢复</h3>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
            <button onclick="copyToClipboard()" class="backup-btn" style="flex:1; padding:12px; border-radius:10px;">📋 复制到剪贴板</button>
            <button onclick="exportJSON()" class="backup-btn" style="flex:1; padding:12px; border-radius:10px;">⬇️ 下载文件</button>
        </div>
        
        <div style="margin-bottom:8px; font-size:0.9rem; color:var(--text);">从文件导入：</div>
        <div class="file-actions">
            <button onclick="triggerFileImport('overwrite')">📂 覆盖导入</button>
            <button onclick="triggerFileImport('append')">➕ 追加导入</button>
        </div>
        <input type="file" id="file-import" accept=".json" style="display: none;" onchange="handleFileSelect(event)">

        <details style="margin-top:15px; color:var(--header-text); font-size:0.85rem;">
            <summary>备用：粘贴代码导入</summary>
            <textarea id="paste-area" style="margin-top:8px; height:60px; font-size:0.8rem;" placeholder='{"word":"test"}...'></textarea>
            <div style="display:flex; gap:8px; margin-top:5px;">
                <button onclick="importFromText('overwrite')" class="backup-btn" style="flex:1; background:#94a3b8; color:white; padding:8px; border-radius:8px;">覆盖粘贴</button>
                <button onclick="importFromText('append')" class="backup-btn" style="flex:1; background:#6366f1; color:white; padding:8px; border-radius:8px;">追加粘贴</button>
            </div>
        </details>
    </div>

    <div class="panel">
        <h3>➕ 批量加词</h3>
        <textarea id="add-area" placeholder="apple:苹果 (换行输入下一个)" style="height:100px;"></textarea>
        <button onclick="addWords()" style="width:100%; background:var(--primary); color:white; padding:12px; margin-top:10px; border-radius:10px; font-size:1rem;">添加新词</button>
    </div>

    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin:0;">📚 词库列表 (<span id="total-count">0</span>)</h3>
            <div class="toggle-ignored">
                <label for="showIgnored">显示已斩单词</label>
                <input type="checkbox" id="showIgnored" onchange="toggleShowIgnored()">
            </div>
        </div>
        <div id="list-box" style="max-height:500px; overflow-y:auto; padding-right:5px;"></div>
    </div>
</div>

<script>
    // --- 数据层 ---
    let db = JSON.parse(localStorage.getItem('vocab_helper_db') || localStorage.getItem('vocab_v11') || '[]');
    
    db.forEach(w => {
        if (w.reviewCount === undefined) w.reviewCount = 0;
        if (w.ignored === undefined) w.ignored = false;
        if (w.score === undefined) w.score = 0;
        if (w.score === 0) w.status = 'new';
        else if (w.score >= 100) w.status = 'mastered';
        else w.status = 'learning';
    });

    let config = JSON.parse(localStorage.getItem('vocab_cfg')) || { batch: 10 };
    
    let queue = [];
    let current = null;
    let showIgnored = false;

    document.getElementById('batch-set').value = config.batch;
    updateUI();

    // --- 主题切换 ---
    function toggleTheme() {
        const body = document.body;
        const toggle = document.getElementById('theme-toggle');
        body.classList.toggle('dark-theme');
        const isDark = body.classList.contains('dark-theme');
        toggle.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('vocab_theme', isDark ? 'dark' : 'light');
    }

    (function initTheme() {
        const savedTheme = localStorage.getItem('vocab_theme');
        const body = document.body;
        const toggle = document.getElementById('theme-toggle');
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
            toggle.textContent = '☀️';
        } else {
            toggle.textContent = '🌙';
        }
    })();

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function saveConfig() {
        config.batch = parseInt(document.getElementById('batch-set').value) || 10;
        localStorage.setItem('vocab_cfg', JSON.stringify(config));
    }

    function saveDB() {
        db.forEach(w => {
            if (w.score === 0) w.status = 'new';
            else if (w.score >= 100) w.status = 'mastered';
            else w.status = 'learning';
        });
        localStorage.setItem('vocab_helper_db', JSON.stringify(db));
        updateUI();
    }

    function updateUI() {
        const activeWords = db.filter(w => !w.ignored);
        const newCount = activeWords.filter(x => x.score === 0).length;
        const learningCount = activeWords.filter(x => x.score > 0 && x.score < 100).length;
        const masteredCount = activeWords.filter(x => x.score >= 100).length;
        document.getElementById('s-new').innerText = newCount;
        document.getElementById('s-learn').innerText = learningCount;
        document.getElementById('s-master').innerText = masteredCount;
        document.getElementById('total-count').innerText = activeWords.length;
    }

    function startSession(mode) {
        const limit = config.batch;

        if (mode === 'new') {
            let list = db.filter(x => !x.ignored && x.score === 0 && x.status === 'new').slice(0, limit);
            if(list.length === 0) return alert("暂无新词 (熟练度0的单词)，请先添加。");
            queue = list.slice();
        } 
        else if (mode === 'review') {
            let candidates = db.filter(x => !x.ignored && x.score > 0);
            if(candidates.length === 0) return alert("没有需要复习的单词！");

            candidates.sort((a, b) => {
                if (a.score >= 100 && b.score < 100) return 1;
                if (a.score < 100 && b.score >= 100) return -1;
                if (a.reviewCount !== b.reviewCount) return a.reviewCount - b.reviewCount;
                return a.score - b.score;
            });

            let selected = candidates.slice(0, limit);
            selected.forEach(w => { w.score = Math.max(0, w.score - 20); });
            saveDB();

            selected.sort((a, b) => {
                if (a.score >= 100 && b.score < 100) return 1;
                if (a.score < 100 && b.score >= 100) return -1;
                if (a.reviewCount !== b.reviewCount) return a.reviewCount - b.reviewCount;
                return a.score - b.score;
            });
            queue = selected;
        }

        queue = shuffleArray(queue);
        nav('study');
        nextCard();
    }

    function nextCard() {
        if (queue.length === 0) {
            alert("🎉 本组学习完成！");
            nav('home');
            return;
        }

        current = queue[0];
        document.getElementById('q-count').innerText = queue.length;
        document.getElementById('w-text').innerText = current.word;
        document.getElementById('d-text').innerText = '';
        document.getElementById('score-val').innerText = current.score;
        
        const bar = document.getElementById('bar');
        bar.style.width = current.score + "%";
        if(current.score < 60) bar.style.background = '#ef4444';
        else if(current.score < 90) bar.style.background = '#f59e0b';
        else bar.style.background = '#10b981';

        document.getElementById('d-text').classList.remove('show');
        document.getElementById('reveal-btn').style.display = 'block';
        document.getElementById('ctrl-btns').style.display = 'none';
    }

    function showDef() {
        document.getElementById('d-text').innerText = current.def;
        document.getElementById('d-text').classList.add('show');
        document.getElementById('reveal-btn').style.display = 'none';
        document.getElementById('ctrl-btns').style.display = 'flex';
    }

    // 修改点：当 val 为 -30（忘了）时，不增加 reviewCount，其他情况增加
    function rate(val) {
        // 只有不是“忘了”时才增加复习次数
        if (val !== -30) {
            current.reviewCount = (current.reviewCount || 0) + 1;
        }
        current.score = Math.min(100, Math.max(0, current.score + val));

        if (current.score === 0) current.status = 'new';
        else if (current.score >= 100) current.status = 'mastered';
        else current.status = 'learning';

        if (current.status === 'mastered') {
            queue.shift();
        } else {
            queue.shift();
            if (Math.random() < 0.5) {
                let insertPos = queue.length === 0 ? 0 : Math.floor(Math.random() * queue.length) + 1;
                queue.splice(insertPos, 0, current);
            } else {
                queue.push(current);
            }
        }

        saveDB();
        nextCard();
    }

    function setMaster() {
        current.reviewCount = (current.reviewCount || 0) + 1;
        current.score = 100;
        current.status = 'mastered';
        queue.shift();
        saveDB();
        nextCard();
    }

    function ignoreCurrent() {
        if (!current) return;
        if (!confirm(`确定要斩掉单词“${current.word}”吗？之后将不再出现。`)) return;
        
        current.ignored = true;
        queue.shift();
        saveDB();
        nextCard();
    }

    function confirmExit() {
        if (confirm("确定结束本次学习？当前进度已自动保存，下次可继续复习。")) {
            nav('home');
        }
    }

    function nav(viewId) {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('study-view').style.display = 'none';
        document.getElementById('manage-view').style.display = 'none';
        
        document.getElementById(viewId + '-view').style.display = viewId === 'study' ? 'flex' : 'block';
        if(viewId === 'home') updateUI();
        if(viewId === 'manage') renderList();
    }

    function toggleShowIgnored() {
        showIgnored = document.getElementById('showIgnored').checked;
        renderList();
    }

    function ignoreWord(index) {
        db[index].ignored = true;
        saveDB();
        renderList();
    }

    function recoverWord(index) {
        db[index].ignored = false;
        saveDB();
        renderList();
    }

    function copyToClipboard() {
        const dataStr = JSON.stringify(db, null, 2);
        const textArea = document.createElement("textarea");
        textArea.value = dataStr;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            alert("✅ 复制成功！");
        } catch (err) {
            alert("❌ 复制失败，请尝试使用“下载文件”功能。");
        }
        document.body.removeChild(textArea);
    }

    function exportJSON() {
        const str = JSON.stringify(db, null, 2);
        const blob = new Blob([str], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `vocab_helper_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    let currentImportMode = 'overwrite';

    function triggerFileImport(mode) {
        currentImportMode = mode;
        document.getElementById('file-import').click();
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                if (Array.isArray(json)) {
                    json.forEach(w => {
                        if (w.reviewCount === undefined) w.reviewCount = 0;
                        if (w.ignored === undefined) w.ignored = false;
                        if (w.score === undefined) w.score = 0;
                        if (w.score === 0) w.status = 'new';
                        else if (w.score >= 100) w.status = 'mastered';
                        else w.status = 'learning';
                    });

                    if (currentImportMode === 'overwrite') {
                        if (confirm(`覆盖导入将替换整个词库 (当前 ${db.length} 个词)，确定吗？`)) {
                            db = json;
                            saveDB();
                            renderList();
                            alert("✅ 覆盖导入成功！");
                        }
                    } else {
                        let added = 0;
                        json.forEach(item => {
                            if (item.word && item.def !== undefined) {
                                const exists = db.some(ex => ex.word.toLowerCase() === item.word.trim().toLowerCase());
                                if (!exists) {
                                    db.push({
                                        word: item.word.trim(),
                                        def: item.def,
                                        status: item.status,
                                        score: item.score,
                                        reviewCount: item.reviewCount,
                                        ignored: item.ignored
                                    });
                                    added++;
                                }
                            }
                        });
                        if (added > 0) {
                            saveDB();
                            renderList();
                            alert(`✅ 追加完成，新增 ${added} 个单词。`);
                        } else {
                            alert("没有新单词可追加 (可能都已存在)");
                        }
                    }
                } else {
                    alert("文件格式错误：根节点应为数组");
                }
            } catch (err) {
                alert("JSON 解析失败：" + err.message);
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function importFromText(mode) {
        try {
            const json = JSON.parse(document.getElementById('paste-area').value);
            if (!Array.isArray(json)) throw new Error("数据不是数组");
            json.forEach(w => {
                if (w.reviewCount === undefined) w.reviewCount = 0;
                if (w.ignored === undefined) w.ignored = false;
                if (w.score === undefined) w.score = 0;
                if (w.score === 0) w.status = 'new';
                else if (w.score >= 100) w.status = 'mastered';
                else w.status = 'learning';
            });

            if (mode === 'overwrite') {
                if (confirm(`覆盖粘贴将替换整个词库 (当前 ${db.length} 个词)，确定吗？`)) {
                    db = json;
                    saveDB();
                    renderList();
                    alert("✅ 覆盖粘贴成功！");
                }
            } else {
                let added = 0;
                json.forEach(item => {
                    if (item.word && item.def !== undefined) {
                        const exists = db.some(ex => ex.word.toLowerCase() === item.word.trim().toLowerCase());
                        if (!exists) {
                            db.push({
                                word: item.word.trim(),
                                def: item.def,
                                status: item.status,
                                score: item.score,
                                reviewCount: item.reviewCount,
                                ignored: item.ignored
                            });
                            added++;
                        }
                    }
                });
                if (added > 0) {
                    saveDB();
                    renderList();
                    alert(`✅ 追加粘贴成功，新增 ${added} 个单词。`);
                } else {
                    alert("没有新单词可追加 (可能都已存在)");
                }
            }
            document.getElementById('paste-area').value = '';
        } catch(e) {
            alert("JSON 格式错误：" + e.message);
        }
    }

    function addWords() {
        const txt = document.getElementById('add-area').value;
        const lines = txt.split('\n');
        let count = 0;
        lines.forEach(l => {
            const p = l.split(/[:：]/);
            if(p.length >= 2) {
                const w = p[0].trim();
                const d = p[1].trim();
                if(w && !db.find(x => x.word.toLowerCase() === w.toLowerCase())) {
                    db.push({ word: w, def: d, status: 'new', score: 0, reviewCount: 0, ignored: false });
                    count++;
                }
            }
        });
        document.getElementById('add-area').value = '';
        saveDB();
        renderList();
        alert(count > 0 ? `成功添加 ${count} 个新词！` : "请检查格式 (每行 单词:释义)");
    }

    function renderList() {
        const box = document.getElementById('list-box');
        box.innerHTML = '';
        
        let wordsToShow = showIgnored ? db : db.filter(w => !w.ignored);
        
        wordsToShow.forEach((item) => {
            const originalIndex = db.findIndex(w => w.word === item.word);

            let tag = '', btn = '';
            if (item.ignored) {
                tag = `<span class="tag t-ignored">已斩</span>`;
                btn = `<button class="btn-sm btn-recover" onclick="recoverWord(${originalIndex})">↺ 恢复</button>`;
            } else {
                if(item.status === 'mastered') {
                    tag = `<span class="tag t-master">已掌握</span>`;
                    btn = `<button class="btn-sm btn-yel" onclick="toggleMastered(${originalIndex})">↺ 重置</button>`;
                } else if (item.status === 'new') {
                    tag = `<span class="tag t-new">新词</span>`;
                    btn = `<button class="btn-sm btn-grn" onclick="setMasterFromList(${originalIndex})">✔ 掌握</button>`;
                } else {
                    tag = `<span class="tag t-learn">熟练 ${item.score}%</span>`;
                    btn = `<button class="btn-sm btn-grn" onclick="setMasterFromList(${originalIndex})">✔ 掌握</button>`;
                }
                btn += `<button class="btn-sm btn-ignore" onclick="ignoreWord(${originalIndex})" style="margin-left:4px;">✂️ 斩掉</button>`;
            }

            const row = document.createElement('div');
            row.className = 'list-row' + (item.ignored ? ' ignored' : '');
            row.innerHTML = `
                <div style="flex:1">
                    <div style="font-size:1rem; font-weight:bold; color:var(--text);">
                        ${item.word} 
                        ${tag}
                        <span class="tag t-count">🔄 ${item.reviewCount || 0}次</span>
                    </div>
                    <div style="font-size:0.85rem; color:var(--header-text); margin-top:4px;">${item.def}</div>
                </div>
                <div style="display:flex; align-items:center; flex-wrap: wrap; justify-content: flex-end;">
                    ${btn}
                    <button class="btn-sm btn-red" onclick="delWord(${originalIndex})" style="margin-left:4px;">✕</button>
                </div>
            `;
            box.appendChild(row);
        });
    }

    function setMasterFromList(i) {
        db[i].score = 100;
        db[i].status = 'mastered';
        saveDB();
        renderList();
    }

    function toggleMastered(i) {
        db[i].score = 0;
        db[i].status = 'new';
        db[i].reviewCount = 0;
        saveDB();
        renderList();
    }

    function delWord(i) {
        if(confirm("确定删除？")) {
            db.splice(i, 1);
            saveDB();
            renderList();
        }
    }

    renderList();
</script>
